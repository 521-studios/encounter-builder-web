name: Staging E2E

# Runs the Playwright functional suite against the DEPLOYED staging SPA, after a
# staging deploy finishes (or on demand). No AWS creds needed — it drives the
# real site over HTTPS with the non-secret staging test account.
on:
  workflow_run:
    workflows: ["Deploy encounter-builder-web"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Serialize runs: a manual dispatch racing an auto workflow_run (or back-to-back
# deploys) would otherwise drive overlapping suites against the shared staging
# account. Newer run wins; in-flight one is cancelled.
concurrency:
  group: staging-e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright vs staging
    runs-on: ubuntu-latest
    # Only after a *successful* deploy (or a manual run).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # npm pins the public pfsrd2-display git dep as git+ssh; rewrite to https.
      - name: Use https for GitHub git deps
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - run: npm ci
      - run: npm run e2e:install
      - name: Run E2E
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
