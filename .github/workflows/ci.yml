name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: SPA build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # CI just verifies the build compiles; a real authority is baked per-env at deploy.
          VITE_OIDC_AUTHORITY: https://lets-roll.staging.521studios.com
        run: npm run build

      - name: Test
        run: npm test

  checks:
    name: terraform fmt/validate + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: shellcheck
        run: shellcheck scripts/*.sh
